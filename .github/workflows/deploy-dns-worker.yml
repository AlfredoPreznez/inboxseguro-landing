name: Deploy DNS Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-dns-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No usar secrets en un `if:` de job: si el token falta, GitHub salta TODOS
      # los jobs y marca el run como failed ("No jobs were run").
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Falta el secret CLOUDFLARE_API_TOKEN en el repo."
            echo "Ve a Settings → Secrets and variables → Actions y créalo."
            echo "Sin ese token no se puede desplegar el worker; el sitio HTML (Pages) no se ve afectado."
            exit 0
          fi
          npx wrangler@3 deploy
